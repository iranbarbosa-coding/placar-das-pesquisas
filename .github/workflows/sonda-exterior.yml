# TEMPORÁRIO — boletins de urna (arquivo-urna) do exterior no 2º turno. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=https://resultados.tse.jus.br/oficial
          curl -sS -m 60 -A "Mozilla/5.0" $R/comum/config/ele-c.json -o /tmp/c.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/c.json'))
          for p in d['pl']:
            print('pleito', p['cd'], p.get('cdpr'), p['dt'], [ (e['cd'], e['nm'][:45]) for e in p['e']])
          PY
          for PL in $(python3 -c "import json;print(' '.join(p['cd'] for p in json.load(open('/tmp/c.json'))['pl'] if p['dt'].startswith('25/10')))"); do
            echo "=================== pleito $PL · config zz"
            curl -sS -m 60 -A "Mozilla/5.0" "$R/ele2026/arquivo-urna/$PL/config/zz/zz-p00$PL-cs.json" -o /tmp/cs.json -w "HTTP %{http_code} %{size_download}\n"
            python3 - "$PL" <<'PY'
          import json,sys,urllib.request
          pl=sys.argv[1]
          try: d=json.load(open('/tmp/cs.json'))
          except Exception as e: print('cs ilegível', e); raise SystemExit
          print('chaves', list(d.keys()))
          abr=d.get('abr',[])
          print('abrangências', len(abr))
          n=0
          for a in abr[:400]:
            for z in a.get('zon',[]):
              for s in z.get('sec',[])[:1]:
                mu,zo,se=a.get('cd'),z.get('cd'),s.get('ns')
                u=f"https://resultados.tse.jus.br/oficial/ele2026/arquivo-urna/{pl}/dados/zz/{mu}/{zo}/{se}/p00{pl}-zz-m{mu}-z{zo}-s{se}-aux.json"
                try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30); aux=json.load(r)
                  print('AUX', a.get('nm') or mu, zo, se, json.dumps(aux)[:300]); n+=1
                except Exception as e: print('sem aux', mu, zo, se, e)
                if n>=3: raise SystemExit
          PY
          done
