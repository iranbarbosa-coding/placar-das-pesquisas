# TEMPORÁRIO — sonda arquivos de 2022 e horários por município (removido antes do merge).
name: sonda-2022
on:
  push:
    branches: [claude/linha-de-chegada]
    paths: [.github/workflows/sonda-2022.yml]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://resultados.tse.jus.br/oficial
          for u in \
            ele2022/544/dados/sp/sp-e000544-ab.json \
            ele2022/545/dados/sp/sp-e000545-ab.json \
            ele2022/545/dados/br/br-e000545-ab.json \
            ele2022/544/dados/sp/sp71072-c0001-e000544-u.json \
            ele2022/544/dados/sp/sp71072-c0001-e000544-v.json \
            ele2022/545/dados/sp/sp71072-c0001-e000545-u.json \
            ele2022/545/dados/sp/sp71072-c0001-e000545-v.json \
            ele2022/545/dados/sp/sp-c0001-e000545-r.json \
            ele2022/545/dados-simplificados/sp/sp-c0001-e000545-r.json \
            ele2022/545/dados/sp/sp-c0001-e000545-v.json \
            ele2022/545/dados/sp/sp-c0001-e000545-u.json ; do
            echo "=================== $u"
            curl -sS -m 60 -A "Mozilla/5.0" -e "https://resultados.tse.jus.br/" -o /tmp/f -w "HTTP %{http_code} %{size_download} bytes\n" "$B/$u"
            head -c 1200 /tmp/f; echo
          done
          for e in ele2026/6257/dados/sp/sp-e006257-ab.json ele2022/545/dados/sp/sp-e000545-ab.json ele2022/544/dados/sp/sp-e000544-ab.json; do
            echo "=================== horários dos municípios: $e"
            curl -sS -m 60 -A "Mozilla/5.0" "$B/$e" | python3 -c "
          import json,sys,collections
          d=json.load(sys.stdin); a=[x for x in d.get('abr',[]) if x.get('tpabr')=='mun']
          print(len(a), 'municípios; chaves:', list(a[0].keys()) if a else None)
          c=collections.Counter((x.get('dt'),(x.get('ht') or '')[:2]) for x in a); print(sorted(c.items()))
          print([ (x['cdabr'],x.get('dt'),x.get('ht')) for x in a[:5]])" || true
          done
