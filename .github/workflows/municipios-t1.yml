# TEMPORÁRIO — roda uma vez no branch da linha de chegada para gerar
# data/apuracao/t1-municipios.json (o TSE não é alcançável do ambiente de
# desenvolvimento) e é removido antes do merge.
name: municipios-t1
on:
  push:
    branches: [claude/linha-de-chegada]
    paths: [.github/workflows/municipios-t1.yml, scripts/tse-municipios-t1.mjs]
permissions:
  contents: write
jobs:
  t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tse-municipios-t1.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/apuracao/t1-municipios.json
          git diff --cached --quiet || git commit -m "dados: 1º turno presidencial por município (TSE), base da linha de chegada"
          git push
