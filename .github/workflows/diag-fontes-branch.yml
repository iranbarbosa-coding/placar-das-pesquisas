name: diag-fontes-branch
# 04/10 (08): reimporta os resultados do TSE com o estado da totalização e sonda arquivos com % de seções
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
permissions:
  contents: write
jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Sondar arquivos de status
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          UA={'User-Agent':'Mozilla/5.0 PlacarDasPesquisas/1.0','Referer':'https://resultados.tse.jus.br/'}
          B="https://resultados.tse.jus.br/oficial/ele2026"
          for u in [f"{B}/6257/dados/br/br-c0001-e006257-i.json", f"{B}/6257/dados/br/br-e006257-i.json",
                    f"{B}/6257/dados/br/br-c0001-e006257-s.json", f"{B}/6257/dados/br/br-c0001-e006257-e.json",
                    f"{B}/6257/dados/br/br-c0001-e006257-a.json", f"{B}/6257/dados-simplificados/br/br-c0001-e006257-r.json",
                    f"{B}/6257/dados/br/br-e006257-ab.json", f"{B}/6257/config/br/br-e006257-c.json",
                    f"{B}/6257/config/br/br-e006257-s.json", f"{B}/6257/dados/br/br-e006257-ta.json",
                    "https://resultados.tse.jus.br/oficial/comum/config/ele-c.json"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)
                  t = r.read().decode('utf-8', 'replace')
                  print("OK ", u, len(t), t[:600].replace("\n", " "))
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, u)
              except Exception as e:
                  print("ERR", u, e)
          PY
      - name: Importar resultados
        run: |
          set +e
          node scripts/tse-resultados.mjs --turno 1
          echo "exit $?"
          python3 - <<'PY'
          import json
          d = json.load(open('data/resultados-oficiais.json'))
          print("disputas:", len(d['disputas']), "| falhas:", d.get('falhas'))
          print("totalizacao:", sorted({str(x.get('totalizacao')) for x in d['disputas']}))
          for x in d['disputas'][:2]:
              print(x['race'], x['uf'], x.get('totalizacao'), x['apurado_pct'], list(x['validos'].items())[:4])
          PY
      - name: Gravar na branch
        run: |
          git config user.name "placar-bot"
          git config user.email "actions@github.com"
          git add data/resultados-oficiais.json
          git commit -m "dados: resultados oficiais do TSE (1º turno) com estado da totalização" || echo "nada a commitar"
          git push
