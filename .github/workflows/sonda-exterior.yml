# TEMPORÁRIO — formato dos arquivos de urna do 2º turno (pleito 3221). Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 -u - <<'PY'
          import json, urllib.request
          H={'User-Agent':'Mozilla/5.0'}
          B="https://resultados.tse.jus.br/oficial/ele2026/arquivo-urna/3221"
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30).read()
          cs=json.loads(get(f"{B}/config/ac/ac-p003221-cs.json"))
          print("cs chaves", list(cs.keys())); s=json.dumps(cs)[:1500]; print(s)
          ab=cs.get('abr',[{}])[0]
          mu=ab.get('mu',[])
          print("municípios", len(mu))
          m=mu[0]; print("mun0", json.dumps(m)[:600])
          z=m['zon'][0]; sec=z['sec'][0]
          print("zona0", z.get('cd'), "seções", len(z['sec']), "sec0", sec)
          cd_m=m['cd']; cd_z=z['cd']; cd_s=sec.get('ns') or sec.get('cd')
          base=f"{B}/dados/ac/{cd_m}/{cd_z}/{cd_s}"
          aux=f"{base}/p003221-ac-m{cd_m}-z{cd_z}-s{cd_s}-aux.json"
          print("aux url", aux)
          a=json.loads(get(aux)); print("aux", json.dumps(a, ensure_ascii=False)[:1500])
          for h in a.get('hashes',[])[:1]:
            for nm in h.get('nmarq',[]):
              if nm.endswith('.imgbu'):
                t=get(f"{base}/{h['hash']}/{nm}").decode('latin1'); print("IMGBU", nm); print(t[:3000])
          # total de seções no país (estimativa por UF)
          tot=0
          for uf in "ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to zz".split():
            try:
              c=json.loads(get(f"{B}/config/{uf}/{uf}-p003221-cs.json"))
              n=sum(len(z['sec']) for m in c['abr'][0]['mu'] for z in m['zon']); tot+=n
            except Exception as e: print(uf, "erro", e)
          print("seções no país:", tot)
          PY
