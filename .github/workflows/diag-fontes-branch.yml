name: diag-fontes-branch
# diag 04/10 (05): caminho do JSON de resultados do TSE 2026 (presidente 6257, estadual 6259)
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36','Accept':'application/json,*/*','Referer':'https://resultados.tse.jus.br/'}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40) as r: return r.status, r.read().decode('utf-8','replace')
              except Exception as e: return None, f"ERRO {e}"
          B="https://resultados.tse.jus.br/oficial/ele2026"
          tent = [
            f"{B}/6257/dados-simplificados/br/br-c0001-e006257-r.json",
            f"{B}/6257/dados/br/br-c0001-e006257-r.json",
            f"{B}/6257/dados/br/br-c0001-e006257-s.json",
            f"{B}/6259/dados-simplificados/sp/sp-c0003-e006259-r.json",
            f"{B}/6259/dados/sp/sp-c0003-e006259-r.json",
            f"{B}/6259/dados/sp/sp-c0005-e006259-r.json",
            f"{B}/6257/config/br/br-c0001-e006257-c.json",
            f"{B}/6257/config/mun-e006257-cm.json",
            "https://resultados.tse.jus.br/oficial/ele2026/6257/dados/br/br-c0001-e006257-u.json",
          ]
          for u in tent:
              st, body = get(u)
              print("-----", u, "→", st, (body[:900] if st else body[:160]))
          PY
