name: diag-fontes-branch
# ensaio 4 (28/09): ids de survey duplicados depois da decodificação da amostra
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - name: Coleta REAL (pode falhar no store; polls.json fica escrito)
        run: node scripts/scrape.mjs 2> scrape.err || true
      - name: Diagnóstico dos ids duplicados
        run: |
          grep "^ERRO" scrape.err | head -12 || true
          node --input-type=module -e "
          import fs from 'node:fs';
          import { buildStoreFromPolls } from './scripts/lib/build-store.mjs';
          const d=JSON.parse(fs.readFileSync('data/polls.json','utf-8')); const polls=Array.isArray(d)?d:d.polls;
          console.log('polls.json:', polls.length, 'pesquisas; generated_at', d.generated_at);
          const { store } = buildStoreFromPolls(polls, { runDate: '2026-09-28', dir: 'data', meta: {} });
          const seen=new Map(); const dups=new Set();
          for (const s of store.surveys) { if (seen.has(s.survey_id)) dups.add(s.survey_id); seen.set(s.survey_id,(seen.get(s.survey_id)??0)+1); }
          console.log('surveys:', store.surveys.length, 'ids duplicados:', dups.size);
          const inst=Object.fromEntries(store.institutes.map(i=>[i.institute_id,i.canonical]));
          for (const id of dups) {
            console.log('=====', id);
            for (const s of store.surveys.filter(x=>x.survey_id===id)) {
              console.log('  SURVEY', JSON.stringify({inst: inst[s.institute_id], names: s.institute_names_raw, uf: s.universe?.uf, start: s.fieldwork_start, end: s.fieldwork_end, pub: s.published_date, n: s.sample_size, reg: s.tse_registration, refs: s.source_refs, seed: s.mint_seed}));
              for (const q of store.questions.filter(q=>q.survey_id===id)) console.log('     Q', q.question_id, q.race, 't'+q.round, q.scenario_label_raw, 'leg', q.legacy_id, JSON.stringify((q.results??[]).map(r=>[r.name_raw,r.pct])), JSON.stringify(q.parse_warnings??[]));
            }
            const refs=new Set(store.surveys.filter(x=>x.survey_id===id).flatMap(s=>(s.source_refs??[]).map(r=>String(r.native_id))));
            for (const p of polls) if (refs.has(String(p.id).split('-')[1]) || refs.has(String(p.id))) console.log('     POLL', p.id, p.source, p.pollster, p.race, p.state, 't'+p.round, p.fieldwork_start, p.fieldwork_end, 'n=',p.sample_size, p.tse_registration, JSON.stringify(p.parse_warnings??null), 'absorvidos', JSON.stringify((p.absorvidos??[]).map(a=>a.id)));
          }
          " 2>&1 | grep -v "^duplicata\|^\[linhagem"
