name: diag-fontes-branch
# ensaio 7 (28/09): as 24 quarentenas contra a fonte
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - name: Coleta REAL
        run: node scripts/scrape.mjs 2> scrape.err
      - run: node scripts/derive-polls.mjs
      - name: Snapshot do store fresco
        run: rm -rf /tmp/fresh && cp -r data /tmp/fresh
      - name: Delta (quarentena)
        run: node scripts/disputa-delta-check.mjs
      - name: Quarentenas contra a fonte
        run: FRESH=/tmp/fresh node scripts/diag/quarentena-fonte.mjs 2>&1 | grep -v "^duplicata\|^\[linhagem"
      - name: Wikipédia SE/SC (linhas dos institutos sumidos)
        run: |
          UA="PlacarDasPesquisas/1.0 (agregador de pesquisas eleitorais)"
          for t in "Pesquisas eleitorais para a eleição estadual de 2026 em Sergipe|Fran[çc]a|Real Time" "Pesquisas eleitorais para a eleição estadual de 2026 em Santa Catarina|Mapa|Neokemp"; do
            title="${t%%|*}"; pat="${t#*|}"
            echo "########## $title · $pat"
            curl -fsS -A "$UA" -G https://pt.wikipedia.org/w/index.php --data-urlencode "title=$title" --data-urlencode action=raw -o w.wiki || { echo inacessível; continue; }
            grep -n -i -E -A4 "^\|.*($pat)" w.wiki | cut -c1-200 | head -80
          done
