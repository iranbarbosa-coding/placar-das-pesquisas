name: diag-fontes-branch
# ensaio 17 (29/09): o que a produção está servindo (host www, frescor exato)
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          W=https://www.placardaspesquisas.com.br
          for u in $W/ $W/presidente $W/institutos $W/senado/al; do
            echo "########## $u"
            curl -sS -D h.txt -o b.txt --max-time 40 -A "PlacarDasPesquisas/diag" "$u"; echo "curl exit $?"
            grep -i -E "^HTTP/|^x-vercel|^age:|^etag|^date:" h.txt
            echo "-- bytes: $(wc -c < b.txt)"
            echo "-- atualizado: $(grep -o -i -E 'atualizad[oa] em[^<]{0,80}' b.txt | head -3)"
            echo "-- buildId: $(grep -o -E '/_next/static/[A-Za-z0-9_-]{12,}/' b.txt | sort -u | head -3)"
            echo "-- datas ISO mais novas: $(grep -o -E '2026-(09|10)-[0-9]{2}' b.txt | sort -u | tail -5 | tr '\n' ' ')"
            echo "-- datas BR mais novas: $(grep -o -E '[0-9]{2}/(09|10)/2026' b.txt | sort -t/ -k2,2 -k1,1 -u | tail -5 | tr '\n' ' ')"
            echo "-- setembro por extenso: $(grep -o -i -E '[0-9]{1,2} de (set|out)[a-z]* de 2026' b.txt | sort -u | tail -5 | tr '\n' ' ')"
          done
          echo "########## $W/api/presidente.json"
          curl -sS -D h.txt -o p.json --max-time 40 "$W/api/presidente.json"; echo "curl exit $?"
          grep -i -E "^HTTP/|^x-vercel|^age:|^etag" h.txt
          python3 - <<'PY'
          import json
          d=json.load(open('p.json'))
          print("generated_at:", d.get("generated_at"))
          for k in ("polls","latest","series","averages"):
              v=d.get(k)
              if isinstance(v,list): print(k, len(v), str(v[-1])[:200] if v else None)
          print("keys:", list(d)[:20])
          PY
          echo "########## $W/api/polls.json"
          curl -sS -o q.json --max-time 60 "$W/api/polls.json"; echo "curl exit $?"
          python3 - <<'PY'
          import json
          d=json.load(open('q.json'))
          print("meta:", {k:v for k,v in d.items() if not isinstance(v,list)})
          polls=d.get("polls") or []
          print("n polls:", len(polls))
          ds=sorted({p.get("fieldwork_end") or p.get("published_date") or "" for p in polls})
          print("newest:", ds[-6:])
          PY
