# TEMPORÁRIO — confere o site no ar. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 180
      - run: |
          python3 - <<'PY'
          import json, urllib.request, time
          def get(u):
            t=time.time(); r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60)
            return r, r.read(), time.time()-t
          num=lambda x: float(str(x or 0).replace(',','.'))
          for uf in ['ap','am']:
            r,b,dt=get(f"https://resultados.tse.jus.br/oficial/ele2026/6258/dados/{uf}/{uf}-c0001-e006258-u.json?t={time.time()}")
            d=json.loads(b); o={}
            for a in d['carg'][0]['agr']:
              for p_ in a['par']:
                for c in p_['cand']: o[c['n']]=(num(c['vap']), c.get('pvap'))
            print("TSE", uf.upper(), "apurado", d['s']['pstn'], "totalização", d.get('dt'), d.get('ht'), "tf", d.get('tf'), "Lula", o.get('13'), "Flávio", o.get('22'))
          for i in range(2):
            r,b,dt=get(f"https://www.placardaspesquisas.com.br/api/apuracao-2t.json?x={time.time()}")
            d=json.loads(b)
            print("CHAVES", list(d.keys()), "motivo", d.get('motivo'), "lidoEm", d.get('lidoEm'), "aguardando", d.get('aguardando'))
            print(f"--- leitura {i+1} ({dt:.1f}s) age={r.headers.get('age')} cache={r.headers.get('x-vercel-cache')}")
            n=d.get('nacional',{})
            print("apurado", n.get('pct'), "seções", n.get('secoes'), "atualizadoEm", d.get('atualizadoEm'))
            print("Lula", d.get('lula',{}).get('pct'), "Flávio", d.get('flavio',{}).get('pct'))
            print("chance", json.dumps(d.get('chance'), ensure_ascii=False))
            for g in d.get('governadores',[]):
              print(" gov", g.get('uf'), [(c.get('nome'), c.get('pct')) for c in g.get('candidatos',[])], "chance", json.dumps(g.get('chance')))
            time.sleep(30)
          r,b,dt=get("https://www.placardaspesquisas.com.br/apuracao")
          h=b.decode()
          import re; print("trechos", re.findall(r'.{120}(?:Aguardando|aguardando|5%).{120}', h)[:4]); print("tem nota:", 'Medidor de chance de vitória fora do ar' in h); print("página", r.status, f"{dt:.1f}s", "tem 'Experimental':", 'Experimental' in h, "tem '5%':", 'cerca de 5%' in h)
          PY
