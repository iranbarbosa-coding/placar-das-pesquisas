name: diag-fontes-branch
# diag 04/10 (02): a linha Gerp 1–3 Out da presidencial que o parser não devolve; e as linhas mais novas da página do Ceará
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  gerp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, 'scripts'); import wiki_parse as W
          t = W._buscar_http("https://pt.wikipedia.org/w/index.php?title=Pesquisas_de_opini%C3%A3o_para_a_elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026&action=raw")
          L = t.split('\n')
          print("########## GERP 1 Out – 3 Out (contexto) ##########")
          for i, l in enumerate(L):
              if re.search(r'1 Out – 3 Out|1 Out - 3 Out', l):
                  for k in range(max(0, i-4), min(len(L), i+16)): print(k, repr(L[k][:200]))
                  print('---')
          print("########## GERP 30 Set – 2 Out (comparação) ##########")
          for i, l in enumerate(L):
              if 'Gerp' in l and i+1 < len(L) and '30 Set' in L[i+1]:
                  for k in range(max(0, i-1), min(len(L), i+14)): print(k, repr(L[k][:200]))
                  print('---'); break
          print("########## CEARÁ: cabeçalhos e primeiras linhas de cada tabela ##########")
          c = W._buscar_http("https://pt.wikipedia.org/w/index.php?title=Pesquisas_eleitorais_para_a_elei%C3%A7%C3%A3o_estadual_de_2026_no_Cear%C3%A1&action=raw")
          C = c.split('\n')
          for i, l in enumerate(C):
              if re.match(r'^==+', l): print(i, l[:80])
              if l.strip().startswith('{|'):
                  # primeira linha de dados: primeiro '|-' seguido de células
                  j = i; n = 0
                  while j < len(C) and n < 3:
                      if C[j].strip() == '|-' and j+2 < len(C) and C[j+1].startswith('|') and not C[j+1].startswith('|-'):
                          print('   linha:', C[j+1][:70].replace('\n',' '), '|', C[j+2][:40]); n += 1
                      j += 1
          PY
