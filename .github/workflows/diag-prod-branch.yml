name: diag-prod-branch
# ensaio 31 (03/10): as 9 quarentenas — o que a fonte serve hoje
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-prod-branch.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          UA="PlacarDasPesquisas/1.0 (agregador de pesquisas eleitorais)"
          w() { curl -fsS -A "$UA" -G https://pt.wikipedia.org/w/index.php --data-urlencode "title=$1" --data-urlencode action=raw -o "$2"; echo "$2: $(wc -l < $2) linhas"; }
          w "Pesquisas eleitorais para a eleição estadual de 2026 no Rio de Janeiro" rj.wiki
          w "Pesquisas eleitorais para a eleição estadual de 2026 no Amapá" ap.wiki
          w "Pesquisas eleitorais para a eleição estadual de 2026 em Mato Grosso do Sul" ms.wiki
          w "Pesquisas eleitorais para a eleição estadual de 2026 em Sergipe" se.wiki
          w "Pesquisas eleitorais para a eleição estadual de 2026 no Acre" ac.wiki
          w "Pesquisas eleitorais para a eleição estadual de 2026 em Mato Grosso" mt.wiki
          echo "########## RJ: Quaest 19-22/09 (governador) — linhas cruas"
          grep -n -B1 -A14 "19 a 22 de setembro\|19 e 22 de setembro" rj.wiki | cut -c1-150 | head -80
          echo "########## AP: F5 e Paraná (senado jul) — linhas cruas"
          grep -n -E "^==+" ap.wiki
          grep -n -A4 -E "^\|.*(F5|Paran)" ap.wiki | cut -c1-150 | head -80
          echo "########## MS: seção Riedel e Fábio Trad + Quaest"
          awk '/^=== Eduardo Riedel e Fábio Trad/,/^=== Eduardo Riedel e Delcídio/' ms.wiki | grep -n -E "^\|[A-Za-z\[]|setembro|^! " | cut -c1-140 | head -40
          echo "-- g1 (Quaest MS 25/09):"; curl -sS -L --max-time 30 -A "Mozilla/5.0" "https://g1.globo.com/ms/mato-grosso-do-sul/eleicoes/2026/noticia/2026/09/25/quaest-mato-grosso-do-sul-governador-25-09.ghtml" -o g1.html; echo "curl exit $?"; grep -o -i -E "(Trad|Delc[ií]dio)[^<]{0,80}" g1.html | sort | uniq -c | sort -rn | head -8
          echo "########## SE: IFP/França 16-18/03 — linhas cruas"
          grep -n -B2 -A20 "16 a 18 de março" se.wiki | cut -c1-140 | head -60
          echo "########## AC: IPSensus na seção Senador?"
          awk '/^== Senador ==/,0' ac.wiki | grep -n -i "sensus" | head; echo "(fim)"
          echo "########## MT: tabela 21,7 / Paraná 6-8 set"
          grep -n "21,7\|21.7" mt.wiki | head; grep -n -A12 "6 a 8 de setembro" mt.wiki | cut -c1-140 | head -60
          echo "########## Poder360: presidente/RJ Quaest 25/07 (t1 e t2)"
          H='-H content-type:application/json -H origin:https://drive.poder360.com.br -A Mozilla/5.0(compatible;PlacarDasPesquisas/1.0)'
          for t in 1 2; do curl -sS --max-time 45 $H "https://monitor-agregador.poder360.com.br/pesquisas/v2/cenarios?cargosId=3&unidadesFederativasId=20&ano=2026&turno=$t&cidade=" -o c$t.json; done
          python3 - <<'PY'
          import json
          for t in (1,2):
              d=json.load(open(f'c{t}.json')); cen=(d.get('data') or {}).get('cenarios') or []
              for c in cen:
                  if 'quaest' in str(c.get('instituto','')).lower() and str(c.get('data',''))[:7]=='2026-07':
                      print(t, c.get('id'), c.get('data'), c.get('instituto'), [((r.get('nome') or '∅').strip(), r.get('percentual')) for r in (c.get('apuracao') or [])])
          PY
          echo "########## parser: RJ/AP/MS/SE/AC/MT — linhas relevantes"
          python3 - <<'PY'
          import json
          pages=json.load(open('scripts/wiki-pages.json'))
          json.dump([p for p in pages if p.get('state') in ('RJ','AP','MS','SE','AC','MT')], open('sub.json','w'))
          PY
          python3 scripts/wiki_parse.py sub.json > w.json 2>/dev/null; echo "parser exit $?"
          python3 - <<'PY'
          import json,re
          polls=json.load(open('w.json'))['polls']
          def show(uf,race,pat,since,until='2027'):
              print(f"== {race}/{uf} · {pat} · {since}..{until}")
              for p in polls:
                  if p.get('state')==uf and p.get('race')==race and re.search(pat,p.get('pollster') or '') and since<=(p.get('fieldwork_end') or '')<=until:
                      print("  ", p.get('pollster'), p.get('fieldwork_start'), p.get('fieldwork_end'), 'n', p.get('sample_size'), 't', p.get('round'), p.get('scenario') or '', [(r.get('candidate'), r.get('pct')) for r in p.get('results',[])][:7])
          show('RJ','governador',r'Quaest','2026-09-15','2026-09-30')
          show('AP','governador',r'F5','2026-09-01'); show('AP','senador',r'Paran','2026-07-01','2026-07-31')
          show('MS','governador',r'Quaest','2026-09-20')
          show('SE','governador',r'IFP|Fran','2026-03-01','2026-03-31')
          show('AC','senador',r'.','2026-09-15')
          show('MT','senador',r'Paran','2026-09-01','2026-09-10')
          PY
          true
