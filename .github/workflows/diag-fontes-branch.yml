name: diag-fontes-branch
# diag 04/10: ano por seção (senador:BA) — parser antigo × novo nas 29 páginas + ensaio completo
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml, scripts/wiki_parse.py]
jobs:
  compara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Parser antigo (origin/main) × novo
        run: |
          set +e
          git show origin/main:scripts/wiki_parse.py > /tmp/wiki_parse_old.py
          python3 - <<'PY'
          import sys, json, collections, importlib.util
          def load(path, name):
              spec = importlib.util.spec_from_file_location(name, path); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m
          OLD = load('/tmp/wiki_parse_old.py', 'wold'); NEW = load('scripts/wiki_parse.py', 'wnew')
          pages = json.load(open('scripts/wiki-pages.json'))
          cache = {}
          def buscar(u):
              if u not in cache: cache[u] = NEW._buscar_http(u)
              return cache[u]
          po, lo, fo = OLD.coletar(pages, buscar)
          pn, ln, fn = NEW.coletar(pages, buscar)
          print("falhas antigo:", fo); print("falhas novo:", fn)
          key = lambda p: (p.get('race'), p.get('state') or 'BR', p.get('round'), (p.get('pollster') or '')[:22], p.get('fieldwork_start'), p.get('fieldwork_end'), p.get('scenario'), tuple((r['candidate'], r['pct']) for r in p.get('results', [])))
          so = collections.Counter(key(p) for p in po); sn = collections.Counter(key(p) for p in pn)
          print("total antigo", sum(so.values()), "novo", sum(sn.values()))
          print("########## HISTOGRAMA (race,uf,ano) antigo→novo, só onde muda ##########")
          ho = collections.Counter((k[0], k[1], (k[5] or 'SEM')[:4]) for k in so.elements()); hn = collections.Counter((k[0], k[1], (k[5] or 'SEM')[:4]) for k in sn.elements())
          for k in sorted(set(ho) | set(hn)):
              if ho[k] != hn[k]: print(f"  {k}: {ho[k]} → {hn[k]}")
          print("########## LINHAS QUE MUDARAM (fora de senador:BA) ##########")
          saiu = so - sn; entrou = sn - so
          for k, v in sorted(saiu.items(), key=str):
              if not (k[0] == 'senador' and k[1] == 'BA'): print("  -", v, k[:7])
          for k, v in sorted(entrou.items(), key=str):
              if not (k[0] == 'senador' and k[1] == 'BA'): print("  +", v, k[:7])
          print("########## senador:BA novo ##########")
          for k in sorted((k for k in sn.elements() if k[0] == 'senador' and k[1] == 'BA'), key=lambda k: k[5] or ''):
              print("  ", k[5], k[3], k[6], "soma", round(sum(p for _, p in k[7]), 1))
          PY
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - run: python3 scripts/wiki_parse.py --self-test
      - run: node scripts/sources/poder360.mjs --self-test
      - run: node scripts/truncada-restaurada-check.mjs --self-test && node scripts/truncada-restaurada-check.mjs
      - name: Coleta REAL (stderr guardado)
        run: |
          set +e
          node scripts/scrape.mjs > scrape.out 2> scrape.err; rc=$?
          echo "scrape exit $rc"; tail -5 scrape.out
          grep -n -i "ERRO\|Validação falhou\|NÃO gravado" scrape.err | cut -c1-260 | head -20 || true
          exit $rc
      - run: node scripts/derive-polls.mjs
      - name: Portões (os mesmos do cron)
        run: |
          set -e
          node scripts/validate-store.mjs --self-test && node scripts/validate-store.mjs
          node scripts/parity-check.mjs
          node scripts/projection-twin-check.mjs
          node scripts/pollster-clustering-check.mjs
          node scripts/upsert-harness.mjs
          node scripts/roster-retention-check.mjs --self-test && node scripts/roster-retention-check.mjs
          node scripts/disputa-delta-check.mjs --self-test
          echo "########## DELTA ##########"
          node scripts/disputa-delta-check.mjs
          node scripts/source-fallback-check.mjs --self-test && node scripts/source-fallback-check.mjs
          node scripts/curated-insert-check.mjs --self-test && node scripts/curated-insert-check.mjs
          node scripts/existencia-pos-guarda-check.mjs && node scripts/existencia-pos-guarda-check.mjs --self-test
          node scripts/fusao-cenarios-check.mjs
          node scripts/idempotence-check.mjs
          node scripts/validate-data.mjs data/polls.json
          node scripts/incomplete-polls.mjs
          node scripts/census.mjs
      - name: Relatório
        if: always()
        run: |
          echo "########## CURADAS RJ ##########"
          grep -n "presidente/RJ\|presidente.*RJ.*add_poll\|vizinho SEM DATA" scrape.err | cut -c1-240 | head -12 || true
          echo "########## RATIFICADAS ##########"
          grep -c "ratificad" data/conflicts.ndjson || true
          grep "question_sumida_ratificada\|ratificada" data/conflicts.ndjson | python3 -c "
          import sys,json
          for l in sys.stdin:
              c=json.loads(l); print('  ',c.get('type'),c.get('record_id'),'|',(c.get('note') or '')[:120])
          " | head -20 || true
          echo "########## SUMIDAS/QUARENTENA ##########"
          grep -c "disputa_em_quarentena" data/conflicts.ndjson || true
          grep "disputa_em_quarentena" data/conflicts.ndjson | python3 -c "
          import sys,json
          for l in sys.stdin:
              c=json.loads(l); print('  ',c['record_id'],'|',c['note'][:200])
          " || true
          echo "########## DIFF ##########"
          git diff --stat data/ | tail -3
