name: diag-fontes-branch
# ensaio 12 (29/09): 2º turno de um nome só + linhagem de levantamento, sobre o dado fresco
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - run: python3 scripts/wiki_parse.py --self-test
      - run: node scripts/sources/poder360.mjs --self-test
      - name: Coleta REAL (stderr guardado)
        run: node scripts/scrape.mjs > scrape.out 2> scrape.err; cat scrape.out | tail -40
      - run: node scripts/derive-polls.mjs
      - name: Portões (os mesmos do cron)
        run: |
          set -e
          node scripts/validate-store.mjs --self-test && node scripts/validate-store.mjs
          node scripts/parity-check.mjs
          node scripts/projection-twin-check.mjs
          node scripts/pollster-clustering-check.mjs
          node scripts/upsert-harness.mjs
          node scripts/roster-retention-check.mjs --self-test && node scripts/roster-retention-check.mjs
          node scripts/disputa-delta-check.mjs --self-test
          echo "########## DELTA ##########"
          node scripts/disputa-delta-check.mjs
          node scripts/source-fallback-check.mjs --self-test && node scripts/source-fallback-check.mjs
          node scripts/curated-insert-check.mjs --self-test && node scripts/curated-insert-check.mjs
          node scripts/existencia-pos-guarda-check.mjs && node scripts/existencia-pos-guarda-check.mjs --self-test
          node scripts/fusao-cenarios-check.mjs
          node scripts/idempotence-check.mjs
          node scripts/validate-data.mjs data/polls.json
          node scripts/incomplete-polls.mjs
          node scripts/census.mjs
      - name: Relatório
        if: always()
        run: |
          echo "########## DEDUPE NA MESMA MARCA ##########"
          grep -c "duplicata na mesma marca" scrape.err || true
          grep "duplicata na mesma marca" scrape.err || true
          echo "########## REPAROS AP ##########"
          grep -i "AP\b.*quaest\|quaest.*AP\|Verit.*AP\|reparo.*AP" scrape.err | head -20 || true
          grep -i "PESQUISA CURADA\|inserida" scrape.err | grep -i "AP" | head || true
          echo "########## CENSO: UNIVERSO ##########"
          awk '/^## UNIVERSO/,/^## PARTIDA/' CENSO_BANCO.md
          echo "########## CENSO: DUPLICATA ELENCO REPETIDO 2026 ##########"
          awk '/^## DUPLICATA/,/^## CONFLITO/' CENSO_BANCO.md | grep -A3 "2026.*ELENCO REPETIDO" || echo "nenhum"
          awk '/^## DUPLICATA/,/^## CONFLITO/' CENSO_BANCO.md | grep -c "ELENCO REPETIDO" || true
          echo "########## CENSO: SOMA ##########"
          awk '/^## SOMA/,/^## /' CENSO_BANCO.md | head -20
          echo "########## GATE MUNICIPAL ##########"
          node scripts/municipal-gate-check.mjs 2>&1 | grep -v "^  ok\|XX  E " || true
          echo "########## POLLS AP ##########"
          node --input-type=module -e "
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('data/polls.json','utf-8')); const polls=Array.isArray(d)?d:d.polls;
          for (const p of polls) if (p.state==='AP' && ((p.pollster==='Quaest' && p.fieldwork_end==='2026-08-24') || (p.pollster==='Veritá' && p.fieldwork_end==='2026-05-31')))
            console.log(p.id, p.race, 't'+p.round, p.tse_registration, p.fieldwork_start, JSON.stringify(p.results.map(r=>[r.candidate,r.pct])), 'bn',p.blank_null_pct,'u',p.undecided_pct, p.repaired?'REPARADA':'', p.incomplete?'INCOMPLETA':'');
          const q=fs.readFileSync('data/questions.ndjson','utf-8').split('\n').filter(Boolean).map(JSON.parse);
          const s=Object.fromEntries(fs.readFileSync('data/surveys.ndjson','utf-8').split('\n').filter(Boolean).map(JSON.parse).map(x=>[x.survey_id,x]));
          console.log('########## PARES DEDUPADOS NO STORE ##########');
          for (const [uf,end,race,round] of [['ES','2026-07-21','governador',1],['PA','2026-09-07','governador',2],['PA','2026-08-28','governador',2],['MT','2026-07-27','governador',2],['MT','2026-03-23','governador',2]])
            for (const x of q) if (x.uf===uf && x.race===race && x.round===round && s[x.survey_id]?.fieldwork_end===end)
              console.log(uf,end,x.question_id,x.survey_id,s[x.survey_id].tse_registration,x.scenario_label_raw,JSON.stringify(x.results.map(r=>[r.name_raw,r.pct])),'legacy_ids',JSON.stringify(x.legacy_ids??[]));
          "
          echo "########## DIFF DO STORE ##########"
          git status --short data/ CENSO_BANCO.md PESQUISAS_INCOMPLETAS.md
          git diff --stat data/ | tail -3
          echo "########## RETENÇÃO / FRAGMENTOS / RE-CUNHAGEM ##########"
          grep "ELENCO RETIDO\|2º TURNO DE UM NOME\|RE-CUNHAGEM\|descartada \[2º turno" scrape.err scrape.out 2>/dev/null | head -20 || true
          echo "########## SUMIDAS/QUARENTENA ##########"
          grep -c "disputa_em_quarentena" data/conflicts.ndjson || true
          grep "disputa_em_quarentena" data/conflicts.ndjson | python3 -c "
          import sys,json
          for l in sys.stdin:
              c=json.loads(l); print('  ',c['record_id'],'|',c['note'][:170])
          " || true
          echo "########## RENAN SANTOS NO STORE NOVO ##########"
          grep -c "Renan Santos" data/questions.ndjson || true
          node --input-type=module -e "
          import fs from 'node:fs';
          const q=fs.readFileSync('data/questions.ndjson','utf-8').split('\n').filter(Boolean).map(JSON.parse);
          const r2=q.filter(x=>x.round===2 && x.race==='presidente' && (x.results??[]).some(r=>/Renan/.test(r.name_raw??'')));
          console.log('2º turnos com Renan Santos:', r2.length, '| com aviso de fragmento:', r2.filter(x=>(x.parse_warnings??[]).some(w=>/um só nome/.test(w))).length);
          const frag=q.filter(x=>x.round===2 && (x.results??[]).length<2); console.log('2º turnos com <2 nomes no store:', frag.length);
          "
