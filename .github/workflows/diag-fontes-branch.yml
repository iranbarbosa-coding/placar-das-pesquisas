name: diag-fontes-branch
# 04/10 (06): importa os resultados do TSE (1º turno) e grava data/resultados-oficiais.json na branch
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
permissions:
  contents: write
jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Importar resultados
        run: |
          set +e
          node scripts/tse-resultados.mjs --turno 1
          echo "exit $?"
          python3 - <<'PY'
          import json
          d = json.load(open('data/resultados-oficiais.json'))
          print("disputas:", len(d['disputas']), "| falhas:", d.get('falhas'))
          for x in d['disputas'][:3]:
              print(x['race'], x['uf'], 'apurado', x['apurado_pct'], list(x['validos'].items())[:5])
          PY
      - name: Gravar na branch
        run: |
          git config user.name "placar-bot"
          git config user.email "actions@github.com"
          git add data/resultados-oficiais.json
          git commit -m "dados: resultados oficiais do TSE (1º turno), lidos pelo runner" || echo "nada a commitar"
          git push
