# DIAGNÓSTICO (só manual): enumera as subpáginas REAIS da Wikipédia para a
# presidencial 2026 via API do MediaWiki, a partir do runner (que alcança a
# Wikipédia). Motivo: a Wikipédia dividiu a página principal em subpáginas
# transcluídas; o coletor lê o wikitext CRU (`action=raw`), que devolve só o
# marcador `{{:Subpágina}}` — as tabelas antigas somem da coleta e o guarda de
# delta congela presidente:BR. Isto lista o que precisa entrar em
# scripts/wiki-pages.json sem adivinhar URL nenhuma.
name: Diagnóstico — subpáginas da Wikipédia (presidencial)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Subpáginas por prefixo, transclusões da principal e referências no wikitext cru
        run: |
          set -uo pipefail
          UA="placar-das-pesquisas/diag (+https://www.placardaspesquisas.com.br; contato@placardaspesquisas.com.br)"
          q() { local url="$1"; shift; curl -fsS -A "$UA" -G "$url" "$@"; }
          titulos() { python3 -c 'import json,sys; d=json.load(sys.stdin); [print(" •", p["title"]) for p in d.get("query",{}).get("allpages",[])]'; }
          transcl() { python3 -c 'import json,sys; d=json.load(sys.stdin); [print(" •", t["title"]) for p in d.get("query",{}).get("pages",{}).values() for t in p.get("templates",[])]'; }

          PT="Pesquisas de opinião para a eleição presidencial no Brasil em 2026"
          EN="Opinion polling for the 2026 Brazilian presidential election"

          echo "===== PT: allpages com prefixo '$PT/' ====="
          q "https://pt.wikipedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "list=allpages" \
            --data-urlencode "apprefix=$PT/" --data-urlencode "aplimit=500" --data-urlencode "format=json" | titulos
          echo "===== PT: páginas (ns 0) TRANSCLUÍDAS pela principal ====="
          q "https://pt.wikipedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "prop=templates" \
            --data-urlencode "titles=$PT" --data-urlencode "tlnamespace=0" --data-urlencode "tllimit=500" --data-urlencode "format=json" | transcl
          echo "===== PT: linhas do wikitext CRU da principal que referenciam subpáginas ====="
          q "https://pt.wikipedia.org/w/index.php" --data-urlencode "title=$PT" --data-urlencode "action=raw" \
            | grep -n "{{:\|/Primeiro\|/Segundo\|/20[0-9][0-9]" | head -60 || echo "(nenhuma referência encontrada)"

          echo "===== EN: allpages com prefixo '$EN/' ====="
          q "https://en.wikipedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "list=allpages" \
            --data-urlencode "apprefix=$EN/" --data-urlencode "aplimit=500" --data-urlencode "format=json" | titulos
          echo "===== EN: páginas (ns 0) TRANSCLUÍDAS pela principal ====="
          q "https://en.wikipedia.org/w/api.php" --data-urlencode "action=query" --data-urlencode "prop=templates" \
            --data-urlencode "titles=$EN" --data-urlencode "tlnamespace=0" --data-urlencode "tllimit=500" --data-urlencode "format=json" | transcl
          echo "===== fim ====="
