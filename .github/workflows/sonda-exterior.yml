# TEMPORÁRIO — colunas do boletim de urna (bweb) do 1º turno. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          python3 -u - <<'PY'
          import json, urllib.request, zipfile, io, csv
          H={'User-Agent':'Mozilla/5.0'}
          d=json.loads(urllib.request.urlopen(urllib.request.Request("https://dadosabertos.tse.jus.br/api/3/action/package_show?id=resultados-2026-boletim-de-urna",headers=H),timeout=30).read())['result']
          urls=[r['url'] for r in d['resources']]
          for u in urls: print(" ", u.split('/')[-1])
          ac=[u for u in urls if '_AC_' in u and u.endswith('.zip')][0]
          z=zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(urllib.request.Request(ac,headers=H),timeout=120).read()))
          n=[x for x in z.namelist() if x.lower().endswith('.csv')][0]
          r=csv.reader(io.TextIOWrapper(z.open(n),encoding='latin1'),delimiter=';')
          h=next(r); print("COLUNAS", h); print("LINHA", next(r))
          PY
