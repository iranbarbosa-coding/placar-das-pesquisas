name: diag-fontes-branch
# diag 04/10 (02): Datafolha 03/10 e AtlasIntel 27/09–02/10 — o que as fontes e as matérias trazem
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wikipédia PT + Poder360 + matérias
        run: |
          set +e
          python3 - <<'PY'
          import re, json, urllib.request, html
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) PlacarDasPesquisas/1.0'}
          def get(u, t=40):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t) as r: return r.read().decode('utf-8','replace')
              except Exception as e: return f"ERRO {e}"
          print("########## WIKIPÉDIA PT (linhas com Datafolha/AtlasIntel e outubro) ##########")
          w = get("https://pt.wikipedia.org/w/index.php?title=Pesquisas_de_opini%C3%A3o_para_a_elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026&action=raw")
          lines = w.split('\n')
          for i,l in enumerate(lines):
              if re.search(r'Datafolha|AtlasIntel|Atlas/Bloomberg|4\s?\.?006|4\s?\.?945', l):
                  print(i, '|', l[:230])
                  for k in range(1, 14):
                      if i+k < len(lines): print('   ', lines[i+k][:160])
                  print('---')
              if i > 700: break
          print("########## PODER360 v2 presidente 1º turno (publicadas >= 2026-10-02) ##########")
          for turno in (1, 2):
              p = get(f"https://monitor-agregador.poder360.com.br/pesquisas/v2/cenarios?cargosId=3&ano=2026&turno={turno}&cidade=")
              try:
                  d = json.loads(p)
              except Exception as e:
                  print("poder360 turno", turno, "não é JSON:", p[:300]); continue
              items = d if isinstance(d, list) else d.get('data') or d.get('cenarios') or d.get('pesquisas') or []
              print("turno", turno, "itens:", len(items), "chaves:", list(items[0].keys())[:25] if items else None)
              for it in items:
                  s = json.dumps(it, ensure_ascii=False)
                  if re.search(r'2026-10-0[1-4]|03/10/2026|02/10/2026', s) and re.search(r'Datafolha|Atlas', s, re.I):
                      print(s[:900]); print('---')
          print("########## MATÉRIAS ##########")
          for u in ["https://www.em.com.br/politica/2026/10/7513949-datafolha-lula-tem-47-e-flavio-46-no-segundo-turno.html",
                    "https://www.terra.com.br/noticias/eleicoes/pesquisas/pesquisa-datafolha-para-presidente-lula-tem-45-em-votos-validos-no-1-turno-flavio-42,597a96c5fe46c0463655d63f0034f9cb2uirzcsq.html",
                    "https://jovempan.com.br/politica/atlas-bloomberg-lula-467-flavio-bolsonaro-438-primeiro-turno-2026-10-03/",
                    "https://jovempan.com.br/politica/atlas-bloomberg-lula-476-flavio-bolsonaro-474-segundo-turno-2026-10-03/"]:
              t = get(u)
              print("=====", u, len(t))
              txt = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S)
              txt = html.unescape(re.sub(r'<[^>]+>', ' ', txt)); txt = re.sub(r'\s+', ' ', txt)
              for m in re.finditer(r'[^.]{0,220}\d{1,2}(,\d)?\s?%[^.]{0,220}\.', txt):
                  s = m.group(0).strip()
                  if re.search(r'Lula|Flávio|Caiado|Cury|Renan|Zema|branco|nulo|indecis|não sabe|registr|entrevist', s, re.I): print(' ·', s[:440])
          PY
