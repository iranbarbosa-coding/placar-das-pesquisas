# TEMPORÁRIO — gera data/apuracao/t1-governador.json e as fotos dos finalistas
# (o TSE não é alcançável do ambiente de desenvolvimento); removido antes do merge.
name: governador-t1
on:
  push:
    branches: [claude/apuracao-governadores]
    paths: [.github/workflows/governador-t1.yml, scripts/tse-governador-t1.mjs]
permissions:
  contents: write
jobs:
  t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tse-governador-t1.mjs | tee /tmp/gov.log
      - run: |
          grep '^SQS ' /tmp/gov.log | while read _ uf a b; do
            SILENCIO=1 node scripts/fotos-candidatos.mjs candidatos-2026 --uf=$uf $a $b || echo "sem foto em $uf"
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/apuracao/t1-governador.json public/candidatos
          git diff --cached --quiet || git commit -m "dados: governador 1º turno por município (TSE) e fotos dos finalistas, base da chance ao vivo"
          git push
