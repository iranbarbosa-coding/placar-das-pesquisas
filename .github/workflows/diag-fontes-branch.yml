name: diag-fontes-branch
# 13/10: por que a média do 2º turno parou em 09/10? Lê a fonte (Wikipédia PT/EN) do runner.
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
permissions:
  contents: read
jobs:
  fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Linhas recentes do 2º turno na Wikipédia
        run: |
          set +e
          UA="Mozilla/5.0 (placardaspesquisas.com.br diag)"
          for t in "pt|Pesquisas_de_opini%C3%A3o_para_a_elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026" "pt|Pesquisas_de_opini%C3%A3o_para_a_elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026/Segundo_Turno" "en|Opinion_polling_for_the_2026_Brazilian_presidential_election"; do
            lang=${t%%|*}; title=${t#*|}
            echo "=================== $lang $title"
            curl -fsS -A "$UA" "https://$lang.wikipedia.org/w/index.php?title=$title&action=raw" -o page.txt || { echo "falhou"; continue; }
            wc -c page.txt
            echo "--- subpáginas transcluídas:"; grep -o '{{:[^}|]*' page.txt | sort -u | head -20
            echo "--- linhas com institutos de interesse (Gerp/Ideia/Meio/Quaest/Paraná/Futura/Real Time/Datafolha/Atlas):"
            grep -n -i "gerp\|ideia\|quaest\|paran[áa] pesquisas\|futura\|real time\|datafolha\|atlas" page.txt | grep -i "out\|oct\|2026-10\|/10/\|10/2026" | head -40
            echo "--- qualquer linha com 'de outubro' ou 'October' ou '-10-' em 2026:"
            grep -n -i "de outubro de 2026\|October 2026\|2026-10-\|/10/2026\|out\. 2026" page.txt | head -40
          done
          echo "=================== subpáginas 2º turno PT (se existirem)"
          for sub in "Segundo_Turno/2026" "Segundo_Turno/2026/Outubro" "Segundo_Turno/2026/Setembro_a_Outubro" "Segundo_Turno/2026/Julho_a_Outubro"; do
            title="Pesquisas_de_opini%C3%A3o_para_a_elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026/$sub"
            code=$(curl -s -A "$UA" -o sub.txt -w '%{http_code}' "https://pt.wikipedia.org/w/index.php?title=$title&action=raw")
            echo "--- $sub -> HTTP $code $(wc -c < sub.txt)"
            [ "$code" = 200 ] && grep -n -i "gerp\|ideia\|datatrends\|atlas\|datafolha\|ipespe\|quaest\|paran" sub.txt | tail -25
          done
      - name: Histórico recente das páginas (quem editou quando)
        run: |
          UA="Mozilla/5.0 (placardaspesquisas.com.br diag)"
          for t in "pt|Pesquisas_de_opini%C3%A3o_para_a_elei%C3%A7%C3%A3o_presidencial_no_Brasil_em_2026" "en|Opinion_polling_for_the_2026_Brazilian_presidential_election"; do
            lang=${t%%|*}; title=${t#*|}
            echo "=== $lang"; curl -fsS -A "$UA" "https://$lang.wikipedia.org/w/api.php?action=query&prop=revisions&titles=$title&rvlimit=8&rvprop=timestamp|user|comment&format=json" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['timestamp'], r.get('user'), '|', r.get('comment','')[:100]) for p in d['query']['pages'].values() for r in p.get('revisions',[])]"
          done
      - name: Gerp e Meio/Ideia na imprensa
        run: |
          set +e
          UA="Mozilla/5.0 (placardaspesquisas.com.br diag)"
          for u in "https://timesbrasil.com.br/eleicoes-2026/decisao-2026-flavio-bolsonaro-tem-55-dos-votos-validos-contra-45-de-lula-aponta-pesquisa-gerp/" "https://www.dci.com.br/politica/pesquisa-aponta-empate-de-flavio-bolsonaro-e-lula-no-2o-turno-das-eleicoes-2026/"; do
            echo "=== $u"
            curl -fsSL -A "$UA" "$u" -o art.html || { echo falhou; continue; }
            python3 - <<'PY'
          import re,html
          s=open('art.html',encoding='utf-8',errors='ignore').read()
          for m in re.findall(r'<meta[^>]+(?:published_time|modified_time|datePublished)[^>]+>', s)[:4]: print(m)
          for m in re.findall(r'"datePublished"\s*:\s*"[^"]+"', s)[:2]: print(m)
          t=html.unescape(re.sub(r'<[^>]+>',' ',s)); t=re.sub(r'\s+',' ',t)
          for k in ['BR-','entrevist','margem','válidos','validos','DataTrends','entre os dias','realizada']:
            for m in re.finditer(k, t):
              print('…', t[max(0,m.start()-160):m.start()+200], '…'); break
          PY
          done
