name: diag-fontes-branch
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -u
          UA="Mozilla/5.0 (X11; Linux x86_64) PlacarDasPesquisas/1.0 (agregador de pesquisas eleitorais)"
          art() { # url rótulo
            local url="$1" rot="$2"
            echo "########## ART $rot ##########"; echo "$url"
            if ! curl -fsSL --max-time 40 -A "$UA" -o x.html "$url"; then
              echo "direto inacessível; tentando Wayback"
              curl -fsSL --max-time 60 -A "$UA" -o x.html "https://web.archive.org/web/2026/$url" || { echo "inacessível"; return; }
            fi
            python3 - <<'PY'
          import re,html
          t=open('x.html','rb').read().decode('utf-8','replace')
          t=re.sub(r'(?is)<(script|style|noscript|svg|nav|footer|header)[^>]*>.*?</\1>','',t)
          t=re.sub(r'(?s)<[^>]+>',' ',t); t=html.unescape(t); t=re.sub(r'\s+',' ',t)
          pat=re.compile(r'(munic[ií]p|Campo Grande|Rio Branco|Campina Grande|Jo[aã]o Pessoa|eleitor|abrang|amostra|entrevist|registr|TSE|Estado|estadual|cidade|capital|70,[57]|29,5|Furlan)',re.I)
          seen=0
          for m in pat.finditer(t):
              a=max(0,m.start()-160); b=min(len(t),m.end()+160)
              print('…',t[a:b],'…'); seen+=1
              if seen>=40: break
          print('[tamanho texto]',len(t))
          PY
          }
          art "https://diariodopoder.com.br/brasil-e-regioes/cib-brasil/dr-furlan-lidera-para-o-governo-do-amapa-com-705" "Veritá AP 27-31/05 (SOMA 70,7+29,5)"
          art "https://fonte83.com.br/politica/eleicoes-2026/pesquisa-data-ranking-fonte83-aponta-lucas-ribeiro-com-421-e-cicero-lucena-com-246-em-campina-grande/" "Ranking PB gov 11-12/06 n=782"
          art "https://fonte83.com.br/noticias/pesquisa-data-ranking-fonte83-aponta-veneziano-soma-602-joao-azevedo-tem-403-e-queiroga-registra-59-na-soma-dos-votos-ao-senado-em-campina-grande/" "Ranking PB sen 11-12/06 n=787"
          art "https://fonte83.com.br/politica/pesquisa-data-ranking-fonte83-cicero-lucena-tem-384-lucas-ribeiro-183-e-efraim-filho-135-em-joao-pessoa/" "Ranking PB gov 19-20/06 n=783"
          art "https://fonte83.com.br/politica/pesquisa-data-ranking-fonte83-em-joao-pessoa-joao-azevedo-tem-568-veneziano-384-queiroga-138-major-fabio-37-e-nabor-registra-36-ao-senado/" "Ranking PB sen 19-20/06 n=783"
          art "https://correiodoestado.com.br/politica/eduardo-riedel-lidera-disputa-pelo-governo-de-ms-em-1a-pesquisa-do/463588/" "IPR MS gov 05-09/03 n=784"
          art "https://www.regiaonews.com.br/politica/pesquisa-aponta-empate-triplo-em-disputa-ao-senado" "IPR MS sen 05-09/03 n=784"
          art "https://horanoticias.com.br/pesquisa-mostra-estabilidade-de-riedel-e-avanco-dos-adversarios/" "IPR MS gov 27/04-01/05 n=784"
          art "https://www.capitalnews.com.br/politica-e-poder/politica/pesquisa-aponta-lideranca-de-azambuja-ao-senado-com-empate-tecnico-entre-tres-nomes/439992" "IPR MS sen 27/04-01/05 n=784"
          art "https://investigams.com.br/2026/08/25/reinaldo-azambuja-lidera-nova-pesquisa-para-o-senado-seguido-por-contar-vander-e-soraya/" "IPR MS sen 19-23/08 n=784"
          art "https://oaltoacre.com/pesquisa-phoenix-acirra-disputa-pelo-governo-do-acre-e-mostra-bocalom-se-aproximando-de-mailza/" "Phoenix AC gov 08-10/09 n=615"
