# TEMPORÁRIO — mesmo eleitor, 1º × 2º turno, município a município. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          B="https://resultados.tse.jus.br/oficial/ele2026/6258/dados"
          def get(u):
            import time
            for i in range(6):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60))
              except Exception as e: err=e; time.sleep(2*(i+1))
            raise err
          num=lambda s: float(str(s or 0).replace(',','.'))
          def votos(d):
            o={}
            for a in d['carg'][0]['agr']:
              for p in a['par']:
                for c in p['cand']: o[c['n']]=num(c['vap'])
            return o.get('13',0), o.get('22',0)
          ufs="ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to zz".split()
          t1=json.load(open('data/apuracao/t1-municipios.json'))['mun']
          br=get(f"{B}/br/br-c0001-e006258-u.json"); L,F=votos(br)
          print("BR", br.get('ht'), "apurado", br['s']['pstn'], "Flávio %", round(100*F/(L+F),2))
          mun=[]
          def ab(u):
            d=get(f"{B}/{u}/{u}-e006258-ab.json")
            return [(u, a['cdabr'], num(a['e']['te']), num(a['e']['est'])) for a in d.get('abr',[]) if a.get('tpabr')=='mun' and num(a['e']['est'])>0]
          with ThreadPoolExecutor(6) as ex:
            for r in ex.map(ab, ufs): mun+=r
          print("municípios com algo apurado:", len(mun))
          def mv(m):
            u,cd,te,est=m
            try: l,f=votos(get(f"{B}/{u}/{u}{cd}-c0001-e006258-u.json"))
            except Exception: return None
            return (u,cd,te,est,l,f)
          with ThreadPoolExecutor(12) as ex: res=[r for r in ex.map(mv,mun) if r]
          print("lidos:", len(res))
          agg={}
          for u,cd,te,est,l,f in res:
            b=t1.get(f"{u}{cd}")
            if not b or b[0]+b[1]<=0 or l+f<=0: continue
            r1=b[1]/(b[0]+b[1]); cheio = est>=te
            for k in [(u,'todos'),('BR','todos')]+([(u,'cheios'),('BR','cheios')] if cheio else []):
              a=agg.setdefault(k,[0,0,0,0]); a[0]+=l+f; a[1]+=f; a[2]+=(l+f)*r1; a[3]+=1
          print("Flávio no 2º turno × 1º turno NOS MESMOS MUNICÍPIOS (pesado pelos votos contados)")
          falhas=len(mun)-len(res); print("falhas:", falhas)
          print("UF   | municípios c/ algo: n  2ºT%  1ºT%  dif | 100% apurados: n  2ºT%  1ºT%  dif")
          for u in ['BR']+[x for x in ufs]:
            t=agg.get((u,'todos')); c=agg.get((u,'cheios'))
            f=lambda a: f"{a[3]:5d} {100*a[1]/a[0]:6.2f} {100*a[2]/a[0]:6.2f} {100*(a[1]-a[2])/a[0]:+6.2f}" if a else "    -"
            print(f"{u.upper():4} | {f(t)} | {f(c)}")
          PY
