# TEMPORÁRIO — chance pela conta por UF (a que estava no ar antes de sair), com os dados de agora. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund > /dev/null
      - run: |
          sed -i 's/export const CHANCE_NO_AR = false;/export const CHANCE_NO_AR = true;/' src/lib/apuracao2t.ts
          grep -n "CHANCE_NO_AR = \|LER_MUNICIPIOS = " src/lib/apuracao2t.ts
          cat > /tmp/s.ts <<'TS'
          import { lerApuracao2T } from "./src/lib/apuracao2t";
          (async () => {
            for (let i = 0; i < 2; i++) {
              const d: any = await lerApuracao2T({ fresco: true });
              if (d.aguardando) { console.log("aguardando", d.motivo); continue; }
              const c = d.chance;
              console.log(`TSE ${d.atualizadoEm} · ${d.nacional.pct.toFixed(2)}% apurado · Lula ${d.lula.pct.toFixed(2)} × Flávio ${d.flavio.pct.toFixed(2)}`);
              console.log(c ? `chance Lula ${(100*c.lula).toFixed(1)}% · Flávio ${(100*c.flavio).toFixed(1)}% · projeção Lula ${c.projecaoLula.toFixed(2)} × Flávio ${c.projecaoFlavio.toFixed(2)} · ±${(1.645*c.desvio).toFixed(2)} · falta ${c.falta.toFixed(1)}%` : "sem chance");
              for (const g of d.governadores) console.log(" gov", g.uf, g.candidatos.map((x: any) => `${x.nome} ${x.pct.toFixed(2)}`).join(" × "), g.chance ? `chance ${(100*g.chance.lula).toFixed(1)}% × ${(100*g.chance.flavio).toFixed(1)}% · proj ${g.chance.projecaoLula.toFixed(2)} × ${g.chance.projecaoFlavio.toFixed(2)}` : "sem chance");
              await new Promise((r) => setTimeout(r, 20000));
            }
          })();
          TS
          cp /tmp/s.ts ./sonda.ts && npx --yes tsx ./sonda.ts
