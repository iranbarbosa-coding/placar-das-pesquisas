# TEMPORÁRIO — histórico de abstenção, brancos e nulos (presidente, 1º × 2º turno), dados abertos do TSE. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, zipfile, io, csv, sys, os
          csv.field_size_limit(10**9)
          for ano in [1989,1994,1998,2002,2006,2010,2014,2018,2022]:
            url=f"https://cdn.tse.jus.br/estatistica/sead/odsele/detalhe_votacao_munzona/detalhe_votacao_munzona_{ano}.zip"
            try:
              fn=f"/tmp/d{ano}.zip"; urllib.request.urlretrieve(url, fn)
            except Exception as e:
              print(ano, "falhou", e); continue
            z=zipfile.ZipFile(fn)
            nomes=[n for n in z.namelist() if n.lower().endswith(('.csv','.txt'))]
            br=[n for n in nomes if 'BRASIL' in n.upper()]
            usar=br if br else nomes
            print(ano, "arquivos", len(nomes), "usando", usar[:3], "..." if len(usar)>3 else "")
            tot={}
            for n in usar:
              with z.open(n) as f:
                r=csv.reader(io.TextIOWrapper(f, encoding='latin1'), delimiter=';')
                h=next(r); h=[x.strip('"') for x in h]
                ix=lambda c: h.index(c) if c in h else None
                ic=ix('DS_CARGO'); it=ix('NR_TURNO')
                campos=[c for c in ['QT_APTOS','QT_COMPARECIMENTO','QT_ABSTENCOES','QT_VOTOS_BRANCOS','QT_VOTOS_NULOS','QT_VOTOS_NULOS_TECNICOS','QT_VOTOS_ANULADOS','QT_VOTOS_NOMINAIS','QT_VOTOS_LEGENDA','QT_TOTAL_VOTOS_NULOS'] if c in h]
                if ic is None:
                  print("  sem DS_CARGO; cabeçalho:", h[:40]); break
                for row in r:
                  if row[ic].strip('"').upper()!='PRESIDENTE': continue
                  t=row[it].strip('"'); a=tot.setdefault(t,{c:0 for c in campos})
                  for c in campos:
                    v=row[h.index(c)].strip('"')
                    try: a[c]+=int(v)
                    except: pass
            for t in sorted(tot): print(" ", ano, "turno", t, tot[t])
            os.remove(fn)
          PY
