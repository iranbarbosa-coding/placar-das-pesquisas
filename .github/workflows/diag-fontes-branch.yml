name: diag-fontes-branch
# ensaio 13 (29/09): por que a retenção não completou o fragmento Renan no runner
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - name: Coleta REAL (polls.json cru guardado ANTES do derive)
        run: |
          node scripts/scrape.mjs > scrape.out 2> scrape.err || true
          cp data/polls.json /tmp/polls_raw.json
          grep "descartada \[2º turno\|ELENCO RETIDO\|2º TURNO DE UM NOME\|RE-CUNHAGEM\|store gravado" scrape.out scrape.err | sort -u | head -40
      - name: Reprodução com o anterior = HEAD
        run: |
          git checkout -- data/
          node --input-type=module -e "
          import fs from 'node:fs';
          import { buildStoreFromPolls } from './scripts/lib/build-store.mjs';
          const d=JSON.parse(fs.readFileSync('/tmp/polls_raw.json','utf-8')); const polls=Array.isArray(d)?d:d.polls;
          console.log('polls crus:', polls.length);
          const frags=polls.filter(p=>p.round===2 && (p.results??[]).length<2);
          console.log('fragmentos de 2º turno na lista crua:', frags.length);
          for (const p of frags.slice(0,60)) console.log('  FRAG', p.id, p.source, p.pollster, p.race, p.state, p.fieldwork_end, JSON.stringify(p.results.map(r=>r.candidate)), 'u',p.undecided_pct,'bn',p.blank_null_pct, JSON.stringify(p.parse_warnings??[]), 'absorvidos', JSON.stringify((p.absorvidos??[]).map(a=>a.id)));
          const sp=polls.filter(p=>String(p.id).startsWith('p360-14048-'));
          for (const p of sp) console.log('  SP14048', p.id, p.round, p.scenario, JSON.stringify(p.results.map(r=>[r.candidate,r.pct])));
          const prevQ=fs.readFileSync('data/questions.ndjson','utf-8').split('\n').filter(Boolean).map(JSON.parse);
          const prev=prevQ.find(q=>q.question_id==='q_3f646148c950'); console.log('anterior q_3f646148c950:', prev ? JSON.stringify([prev.survey_id, prev.results.map(r=>[r.name_raw,r.candidate_id])]) : 'AUSENTE');
          process.env.PLACAR_DEBUG_LINHAGEM='0';
          const { store } = buildStoreFromPolls(polls, { runDate: '2026-09-29', dir: 'data', meta: {} });
          const q=store.questions.filter(x=>x.survey_id===(prev?.survey_id));
          console.log('perguntas no survey', prev?.survey_id, ':', q.length);
          for (const x of q) console.log('   ', x.question_id, x.round, x.scenario_label_raw, JSON.stringify(x.results.map(r=>[r.name_raw,r.candidate_id])));
          console.log('retidas:', store.conflicts.filter(c=>c.type==='roster_encolhido_na_fonte').length, '| ambíguas:', store.conflicts.filter(c=>c.type==='roster_shrink_ambiguo').length, '| irrecuperáveis:', store.conflicts.filter(c=>c.type==='roster_shrink_irrecuperavel').length, '| fragmentos descartados:', store._report.fragmentosDescartados??0);
          for (const c of store.conflicts.filter(c=>c.type==='roster_shrink_irrecuperavel'||c.type==='roster_shrink_ambiguo').slice(0,10)) console.log('   ', c.type, c.record_id, c.note.slice(0,160));
          " 2>&1 | grep -v "^duplicata\|^\[linhagem\|^descartada \[cen\|^WARN"
