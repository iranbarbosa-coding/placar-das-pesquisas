# TEMPORÁRIO — calibra a chance de vitória ao vivo (removido antes do merge).
name: sonda-2022
on:
  push:
    branches: [claude/linha-de-chegada]
    paths: [.github/workflows/sonda-2022.yml, scripts/apuracao/backtest_chance.py]
permissions:
  contents: write
jobs:
  calibra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apuracao/backtest_chance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/apuracao/calibracao-chance.json
          git diff --cached --quiet || git commit -m "dados: calibração da chance de vitória ao vivo (1º turno de 2026 refeito na ordem real; base 2022)"
          git push
