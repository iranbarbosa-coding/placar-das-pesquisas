# TEMPORÁRIO — roda uma vez no branch da apuração do 2º turno para trazer as
# fotos oficiais (o TSE não é alcançável do ambiente de desenvolvimento) e é
# removido antes do merge.
name: fotos-2t
on:
  push:
    branches: [claude/apuracao-segundo-turno]
    paths: [.github/workflows/fotos-2t.yml, scripts/fotos-candidatos.mjs]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar fotos de Lula e Flávio Bolsonaro
        run: node scripts/fotos-candidatos.mjs d58fc30b-4eea-4286-a330-15511029e00e 280002542548 280002551544
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/candidatos
          git diff --cached --quiet || git commit -m "fotos oficiais do TSE (dados abertos) de Lula e Flávio Bolsonaro"
          git push
