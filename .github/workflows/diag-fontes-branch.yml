name: diag-fontes-branch
# 04/10 (07): cabeçalho do arquivo -u do TSE (campo de seções apuradas) e um candidato completo
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA={'User-Agent':'Mozilla/5.0 PlacarDasPesquisas/1.0','Referer':'https://resultados.tse.jus.br/'}
          for u in ["https://resultados.tse.jus.br/oficial/ele2026/6257/dados/br/br-c0001-e006257-u.json",
                    "https://resultados.tse.jus.br/oficial/ele2026/6259/dados/sp/sp-c0003-e006259-u.json"]:
              d = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40))
              print("=====", u)
              print("CABEÇALHO:", {k: v for k, v in d.items() if not isinstance(v, (list, dict))})
              for carg in d.get("carg", []):
                  print("CARG:", {k: v for k, v in carg.items() if not isinstance(v, (list, dict))})
                  for agr in carg.get("agr", [])[:1]:
                      print(" AGR:", {k: v for k, v in agr.items() if not isinstance(v, (list, dict))})
                      for par in agr.get("par", [])[:1]:
                          print("  PAR:", {k: v for k, v in par.items() if not isinstance(v, (list, dict))})
                          for c in par.get("cand", [])[:1]: print("   CAND:", c)
          PY
