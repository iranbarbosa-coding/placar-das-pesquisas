name: diag-prod-branch
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-prod-branch.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          W=https://www.placardaspesquisas.com.br
          for u in $W/ $W/presidente; do
            echo "########## $u"
            curl -sS -D h.txt -o b.txt --max-time 40 -A "PlacarDasPesquisas/diag" "$u"; echo "curl exit $?"
            grep -i -E "^HTTP/|^x-vercel-cache|^age:" h.txt
            echo "-- atualizado: $(grep -o -E 'Atualizado em [^<]{0,80}' b.txt | head -1)"
            echo "-- em revisão: $(grep -o -E 'Dado em revis[^<]{0,40}' b.txt | sort -u | head -3 | tr '\n' ' ')"
            echo "-- última pesquisa: $(grep -o -E 'ltima pesquisa (h|em)[^<]{0,60}' b.txt | sort -u | head -2 | tr '\n' ' ')"
            echo "-- média no texto: $(grep -o -E 'lidera com[^<]{0,80}' b.txt | head -1)"
          done
          echo "########## api/presidente.json"
          curl -sS -o p.json --max-time 40 "$W/api/presidente.json"; python3 -c "
          import json; d=json.load(open('p.json')); print('generated_at', d.get('generated_at')); print('average', json.dumps(d.get('average'), ensure_ascii=False)[:400])"
          true
