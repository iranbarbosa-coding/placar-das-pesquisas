name: diag-fontes-branch
# ensaio 28 (29/09): PR #120 completo — linha com citação quebrada descartada
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - run: python3 scripts/wiki_parse.py --self-test
      - run: node scripts/sources/poder360.mjs --self-test
      - run: node scripts/truncada-restaurada-check.mjs --self-test && node scripts/truncada-restaurada-check.mjs
      - name: Coleta REAL (stderr guardado)
        run: |
          set +e
          node scripts/scrape.mjs > scrape.out 2> scrape.err; rc=$?
          echo "scrape exit $rc"; tail -30 scrape.out
          echo "########## ERROS (scrape.err) ##########"
          grep -n -i "ERRO\|Error\|exception\|abort\|NÃO gravado\|Validação falhou\|desconhecid" scrape.err | cut -c1-260 | head -60 || true
          echo "########## cauda do scrape.err ##########"
          tail -60 scrape.err | cut -c1-260
          exit $rc
      - run: node scripts/derive-polls.mjs
      - name: Portões (os mesmos do cron)
        run: |
          set -e
          node scripts/validate-store.mjs --self-test && node scripts/validate-store.mjs
          node scripts/parity-check.mjs
          node scripts/projection-twin-check.mjs
          node scripts/pollster-clustering-check.mjs
          node scripts/upsert-harness.mjs
          node scripts/roster-retention-check.mjs --self-test && node scripts/roster-retention-check.mjs
          node scripts/disputa-delta-check.mjs --self-test
          echo "########## DELTA ##########"
          node scripts/disputa-delta-check.mjs
          node scripts/source-fallback-check.mjs --self-test && node scripts/source-fallback-check.mjs
          node scripts/curated-insert-check.mjs --self-test && node scripts/curated-insert-check.mjs
          node scripts/existencia-pos-guarda-check.mjs && node scripts/existencia-pos-guarda-check.mjs --self-test
          node scripts/fusao-cenarios-check.mjs
          node scripts/idempotence-check.mjs
          node scripts/validate-data.mjs data/polls.json
          node scripts/incomplete-polls.mjs
          node scripts/census.mjs
      - name: Relatório
        if: always()
        run: |
          echo "########## RESTAURADAS ##########"
          grep -c "ELENCO RESTAURADO" scrape.err || true
          grep "ELENCO RESTAURADO\|tabela(s) truncada(s)" scrape.err | cut -c1-200 | head -40 || true
          echo "########## DESCARTES ##########"
          grep -o "descartada \[[^]]*\]" scrape.err | sort | uniq -c | sort -rn || true
          grep "descartada \[soma<30\]\|2º turno de um nome só" scrape.err | cut -c1-180 | head -30 || true
          echo "########## RETENÇÃO / FRAGMENTOS / RE-CUNHAGEM ##########"
          grep -h "ELENCO RETIDO\|2º TURNO DE UM NOME\|RE-CUNHAGEM" scrape.out scrape.err 2>/dev/null | sort -u | head || true
          echo "########## SUMIDAS/QUARENTENA ##########"
          grep -c "disputa_em_quarentena" data/conflicts.ndjson || true
          grep "disputa_em_quarentena" data/conflicts.ndjson | python3 -c "
          import sys,json
          for l in sys.stdin:
              c=json.loads(l); print('  ',c['record_id'],'|',c['note'][:170])
          " || true
          echo "########## AL senado: linhas parseadas de ago-set ##########"
          python3 - <<'PY'
          import json
          qs=[json.loads(l) for l in open('data/questions.ndjson') if l.strip()]
          ss={s['survey_id']:s for s in (json.loads(l) for l in open('data/surveys.ndjson') if l.strip())}
          n=0
          for q in qs:
              s=ss.get(q['survey_id'],{})
              if q.get('race')=='senador' and q.get('uf')=='AL' and (s.get('fieldwork_end') or '')>='2026-08-15':
                  n+=1; print("  ", s.get('institute_names_raw'), s.get('fieldwork_end'), s.get('sample_size'), [(r.get('name_raw'), r.get('pct')) for r in q['results']][:5])
          print("total senador/AL desde 15/08:", n)
          PY
          echo "########## SP: nomes vazados que sobraram ##########"
          python3 - <<'PY'
          import json
          qs=[json.loads(l) for l in open('data/questions.ndjson') if l.strip()]
          vaz=[q for q in qs if any(str(r.get('name_raw','')).startswith('[[') for r in q.get('results',[]))]
          print("perguntas com '[[' no nome:", len(vaz), sorted({f"{q.get('race')}:{q.get('uf')}" for q in vaz}))
          sp=[q for q in qs if q.get('race')=='senador' and q.get('uf')=='SP']
          print("senador/SP perguntas:", len(sp))
          PY
          echo "########## DIFF DO STORE ##########"
          git status --short data/ CENSO_BANCO.md PESQUISAS_INCOMPLETAS.md
          git diff --stat data/ | tail -3
