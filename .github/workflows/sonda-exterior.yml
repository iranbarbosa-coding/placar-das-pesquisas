# TEMPORÁRIO — procura um arquivo do TSE com votos por município numa só leitura. Branch descartável.
name: sonda-exterior
on:
  push:
    branches: [claude/sonda-exterior]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://resultados.tse.jus.br/oficial/ele2026/6258/dados
          for u in rn/rn-c0001-e006258-v.json rn/rn-c0001-e006258-r.json rn/rn-c0001-e006258-e.json rn/rn-e006258-e.json rn/rn-c0001-e006258-m.json rn/rn-c0001-e006258-mu.json rn/rn-c0001-e006258-f.json rn/rn-c0001-e006258-a.json rn/rn-c0001-e006258-ab.json; do
            curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/f -w "$u HTTP %{http_code} %{size_download}\n" "$B/$u"; head -c 300 /tmp/f; echo
          done
          echo "=== um município do RN (Natal 17612) agora"
          curl -sS -m 30 -A "Mozilla/5.0" "$B/rn/rn17612-c0001-e006258-u.json" -o /tmp/m -w "HTTP %{http_code} %{size_download} last-modified %header{last-modified} cache-control %header{cache-control}\n"
          python3 - <<'PY'
          import json; d=json.load(open('/tmp/m'))
          print({k:d.get(k) for k in ['dt','ht','tf','tpabr','cdabr']}, 's', d['s'].get('st'),'/',d['s'].get('ts'), 'e.c', d['e'].get('c'), 'v.vv', d['v'].get('vv'))
          for a in d['carg'][0]['agr']:
            for p in a['par']:
              for c in p['cand']: print(' ', c['n'], c['vap'])
          PY
          echo "=== tempo para 300 municípios (latência)"
          start=$(date +%s.%N); for c in $(curl -sS -A "Mozilla/5.0" "$B/sp/sp-e006258-ab.json" | python3 -c "import json,sys;print(' '.join(a['cdabr'] for a in json.load(sys.stdin)['abr'] if a['tpabr']=='mun'][:300]))"); do echo "$B/sp/sp$c-c0001-e006258-u.json"; done | xargs -P 32 -n 1 curl -sS -m 30 -A "Mozilla/5.0" -o /dev/null -w "%{http_code}\n" | sort | uniq -c; end=$(date +%s.%N); echo "segundos: $(echo "$end - $start" | bc)"
