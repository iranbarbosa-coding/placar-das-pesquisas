name: diag-fontes-branch
# ensaio 10 (28/09): re-datação e datas futuras no store fresco
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-fontes-branch.yml]
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/fetch-candidaturas.mjs
      - run: node scripts/match-ballot-names.mjs
      - name: Coleta REAL
        run: node scripts/scrape.mjs 2> scrape.err
      - run: node scripts/derive-polls.mjs
      - name: Datas do store fresco
        run: FRESH=data node scripts/diag/datas-fresco.mjs 2>&1 | grep -v "^duplicata\|^\[linhagem"
