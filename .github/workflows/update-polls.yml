name: Atualizar pesquisas

on:
  # ⚠ AGENDAMENTO SUSPENSO EM 17/08/2026 — E ISTO NÃO É CAUTELA GENÉRICA.
  #
  # O `v2/cenarios` do Poder360 apaga linhas de candidato cujo campo `nome` vem
  # vazio, e o que ele apaga MUDA COM O TEMPO. Medido em 17/08: a pesquisa
  # `p360-13816` (Futura, BR-08109/2026, presidencial NACIONAL, campo 03–07/08)
  # está no banco com os dez candidatos, e a API hoje devolve, para os dois
  # cenários dela, só `Rui Costa Pimenta 0,8` e `Lula 36,3` — estável em três
  # buscas seguidas. Uma coleta hoje TROCARIA O LÍDER E O VICE DE UMA
  # PRESIDENCIAL NACIONAL POR NADA.
  #
  # Nenhum validador reprova isso: uma lista curta de candidatos é uma lista bem
  # formada — não soma demais, não tem órfão, não repete. E o agregador ainda
  # serve os buckets, que absorvem a massa que sumiu (foi assim que `others_pct: 6`
  # cobriu exatamente as cinco linhas perdidas do PI-06473).
  #
  # Escala medida: 423 ids do Poder360 em que o `v2` hoje descarta ao menos uma
  # linha; 68 registros nossos comprovadamente curtos; 41 disputas ausentes.
  #
  # ⚠ A GUARDA DE ENCOLHIMENTO JÁ EXISTE (17/08/2026) — E O AGENDAMENTO SEGUE
  # SUSPENSO ASSIM MESMO. `scripts/lib/roster.mjs` mantém o elenco da rodada
  # anterior quando o que chega é um subconjunto estrito dele, grava
  # `roster_encolhido_na_fonte` em `conflicts.ndjson` e o coletor imprime a linha
  # `ELENCO RETIDO`; `scripts/roster-retention-check.mjs` prova as duas metades
  # (dispara quando deve, não dispara quando o elenco cresce) e o `--self-test`
  # prova que ele mesmo reprova.
  #
  # RELIGADO em 21/08/2026 por decisão do criador (CONVENTIONS §12), depois de
  # as duas pendências acima terem fechado com guarda, não com promessa:
  #   1. a retenção foi exercitada contra coleta real no ensaio de 20/08 (todas
  #      as fontes ✓; ELENCO RETIDO 6 perguntas/11 linhas, 0 não absorvido);
  #   2. pergunta que desaparece por completo agora é caso do guarda de delta
  #      por disputa (disputa-delta-check + data/disputas-declaradas.json), que
  #      REPROVA a rodada antes do commit salvo prova de sucessão ou ratificação
  #      citada — provado verde contra a coleta consertada (160 sumidas, todas
  #      com prova; PRs #15-#21).
  # 1ª rodada pós-religar: esperar churn one-shot de provenance.updated_at
  # (~2,1 mil registros — o campo stimulus passou a ser alimentado; PR #20).
  schedule:
    - cron: "15 12,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The scrape alone is ~15 min now (81 Poder360 combos + 29 Wikipedia pages
    # + the TSE zip). The store rebuild and the gates add a few more.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 22: `projection-twin-check.mjs` imports `src/lib/store.ts`
          # directly and relies on Node stripping the types. On 22 that needs a
          # flag and the check fails — which would block every run.
          node-version: 24

      # ── the pipeline ────────────────────────────────────────────────────
      # THE STORE IS THE DATABASE; polls.json is derived from it.
      #
      # This job used to run the scraper alone, which wrote polls.json and
      # nothing else — so every bot commit left the NDJSON store untouched and
      # the two drifted apart a little more twice a day. Then the scrape wrote
      # the flat rows and `migrate-to-store.mjs` folded them in.
      #
      # As of 2026-08-16 the scraper writes the store ITSELF, through the
      # resolution ladder (`upsertPoll`), and the migration step is gone. The
      # migration grouped by a key that could not unite what the source splits:
      # Poder360 files each office of one fieldwork operation as its own native
      # record, and the same poll arriving via Wikipédia became a second
      # survey. The ladder decides identity from the data — native id, TSE
      # registration, then institute + UF + a ±3-day window — which is the
      # "one fieldwork operation = one survey" decision actually applied.
      # `scripts/upsert-vs-migration.mjs` is the gate that held the two paths
      # to each other before the switch and still runs below.

      # O registro de candidaturas ANTES da coleta: o nome de urna é o que o
      # site normaliza, então ele tem de estar atualizado quando o coletor
      # canonicaliza os nomes. Substituições e indeferimentos correm até
      # setembro, então isto não é uma carga única.
      - name: Atualizar o registro de candidaturas do TSE
        run: node scripts/fetch-candidaturas.mjs

      # ANTES da coleta, sobre os nomes crus que a rodada ANTERIOR commitou —
      # e isto mudou de lugar por um defeito medido, não por gosto (21/08/2026,
      # run 32531108279): rodando ENTRE a coleta e os portões, o casador
      # reescrevia data/ballot-names.json no meio da própria verificação da
      # rodada. O store saía canonicalizado com a tabela velha, o parity-check
      # media com a tabela recém-reescrita, e todo nome que estreava com
      # candidatura casável virava divergência (140 naquela rodada) — um
      # vermelho que NENHUMA rodada seguinte curava, porque a rodada vermelha
      # não commita a tabela nova (CONVENTIONS §3: artefato que muda durante a
      # verificação anula a verificação; §5: os dois lados têm de consumir a
      # MESMA tabela).
      #
      # O que NÃO mudou: o casador continua lendo `data/nomes-crus.json` (os
      # nomes como o instituto publicou, nunca a saída canonicalizada — senão
      # ele come o próprio rabo e a tabela encolhe a cada rodada), e o mapa que
      # os nomes de uma rodada geram continua valendo só para a rodada seguinte
      # (a defasagem de uma rodada é decisão do criador, HANDOFF §6 item 7).
      # Aqui ele apenas gera o mapa da rodada N com os nomes crus da N−1, de
      # modo que coletor e portões consumam o MESMO estado da tabela, e o
      # commit saia com store e tabela CONSISTENTES entre si.
      - name: Casar nomes de urna com os nomes das pesquisas
        run: node scripts/match-ballot-names.mjs

      - name: Coletar, normalizar e gravar o store
        run: node scripts/scrape.mjs

      - name: Derivar data/polls.json do store
        run: node scripts/derive-polls.mjs

      # ── the gates ───────────────────────────────────────────────────────
      # Every one of these has to pass before anything is committed. A bad
      # scrape that reaches data/ is a bad scrape that reaches the live site:
      # a push to data/ triggers the Vercel rebuild.
      - name: Guardas do validador disparam
        run: node scripts/validate-store.mjs --self-test

      - name: Validar o store
        run: node scripts/validate-store.mjs

      - name: Paridade store ↔ polls.json
        run: node scripts/parity-check.mjs

      - name: Gêmeos da projeção (project.mjs ≡ store.ts)
        run: node scripts/projection-twin-check.mjs

      - name: Agrupamento de institutos estável
        run: node scripts/pollster-clustering-check.mjs

      - name: Caminho de escrita (escada de resolução)
        run: node scripts/upsert-harness.mjs

      # A defesa contra o `v2/cenarios` apagar candidatos. As duas metades são
      # obrigatórias: uma retenção que disparasse sempre congelaria o banco
      # contra toda correção que um instituto publicar. O autoteste roda ANTES,
      # como nos demais guardas — um verde que ninguém testou não é evidência.
      - name: Guarda de retenção de elenco dispara
        run: node scripts/roster-retention-check.mjs --self-test

      - name: Retenção de elenco (encolhimento na fonte)
        run: node scripts/roster-retention-check.mjs

      # A defesa-irmã da retenção: a retenção guarda a pergunta que CHEGA
      # encolhida; o delta guarda a que NÃO CHEGA. Medido no ensaio de
      # 20/08/2026: 56 perguntas sumiriam em 13 disputas com o total SUBINDO
      # (2.996 → 3.029) — piso absoluto não vê (o banco tem ~996 perguntas de
      # folga sobre ele, fraqueza observada duas vezes por sessões
      # independentes), e delta de totais é cego a perda compensada por ganho
      # alheio. presidente:AM terminou 0 → 0 com reparo curado no banco — isso
      # nem delta vê: quem pega é a lista declarada (data/disputas-declaradas
      # .json, disputa `exigida` reprova vazia mesmo partindo de zero). A
      # tolerância é um predicado, nunca um K: sumida passa só com sucessora
      # provada (legacy_ids ou elenco por linhagem DENTRO do mesmo
      # levantamento) ou reparo allow_question_drop com fonte primária.
      - name: Guarda de delta por disputa dispara
        run: node scripts/disputa-delta-check.mjs --self-test

      - name: Delta por disputa (perda silenciosa entre rodadas)
        run: node scripts/disputa-delta-check.mjs

      # A recuperação de fonte caída prometia "mantendo dados anteriores desta
      # fonte" e, para a Wikipédia, guardava ZERO: filtrava por `p.source ===
      # "wikipedia"`, rótulo que a projeção nunca emite. Uma falha de coleta
      # apagaria 1.039 pesquisas com mensagem de sucesso. O autoteste desta
      # bateria reproduz esse predicado histórico e exige que ela REPROVE.
      - name: Guarda de recuperação de fonte dispara
        run: node scripts/source-fallback-check.mjs --self-test

      - name: Recuperação de fonte caída (partição por espaço de id)
        run: node scripts/source-fallback-check.mjs

      # A retenção de elenco guarda pergunta a pergunta e NÃO alcança a pergunta
      # que a fonte apaga por completo — o item 2 da lista "o que falta antes de
      # religar" acima. `add_poll` em `data/repairs.json` é a porta curada para
      # essas 41 disputas, e este guarda prova as duas metades: insere quando a
      # pesquisa não existe, NÃO insere quando a fonte volta a servi-la (senão a
      # média conta a mesma amostra duas vezes), e RECUSA sem fonte citada. O
      # autoteste roda antes, como nos demais.
      - name: Guarda de inserção curada dispara
        run: node scripts/curated-insert-check.mjs --self-test

      - name: Inserção curada (disputa apagada por inteiro na fonte)
        run: node scripts/curated-insert-check.mjs

      # Roda 2x/dia: se a reconstrução re-datar registros, cada rodada comita
      # 4.613 linhas de carimbo e o diff deixa de ser legível.
      - name: Reconstrução não redata o que já existia
        run: node scripts/idempotence-check.mjs

      - name: Validador legado
        run: node scripts/validate-data.mjs data/polls.json

      # ── surfaces for review, regenerated with the data ──────────────────
      - name: Regenerar a lista de pesquisas incompletas
        run: node scripts/incomplete-polls.mjs

      # The census is the operational definition of "banco normalizado": fixed
      # classes, counted every run, so the state of the database is a number in
      # a committed file rather than an opinion formed by whoever last audited
      # it. It reports and never fails the build — `validate-store.mjs` owns the
      # line between impossible and merely suspect.
      - name: Regenerar o censo do banco
        run: node scripts/census.mjs

      - name: Commit se houver mudanças
        run: |
          git config user.name "placar-bot"
          git config user.email "actions@github.com"
          if git diff --quiet data/ PESQUISAS_INCOMPLETAS.md CENSO_BANCO.md; then
            echo "Sem pesquisas novas."
          else
            git add data/ PESQUISAS_INCOMPLETAS.md CENSO_BANCO.md
            git commit -m "dados: atualização automática $(date -u +%F' '%H:%M) UTC"
            # Push resiliente a corrida: se o remoto avançou durante a rodada (ex.:
            # um merge de código concorrente), rebaseia por cima e tenta de novo,
            # até 5 vezes. O rebase é seguro — a rodada só toca data/ + os 2 .md;
            # código concorrente mexe em OUTROS arquivos e aplica limpo. Conflito
            # real (outra escrita em data/) aborta em voz alta, sem forçar.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=1; echo "push ok (tentativa $attempt)"; break; fi
              echo "push rejeitado (tentativa $attempt) — git pull --rebase e retry"
              git pull --rebase origin main || { echo "ERRO: rebase falhou (conflito real em data/) — abortando"; exit 1; }
              sleep $((attempt * 3))
            done
            [ "$pushed" = "1" ] || { echo "ERRO: esgotou as 5 tentativas de push"; exit 1; }
          fi
      # O push em data/ dispara o rebuild automático no Vercel (site é 100% estático).
