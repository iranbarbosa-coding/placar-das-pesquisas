name: diag-prod-branch
# ensaio 24: SP — de onde vem a grafia vazada
on:
  push:
    branches: [claude/placar-32-creator-pitches-7dk5vm]
    paths: [.github/workflows/diag-prod-branch.yml]
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          UA="PlacarDasPesquisas/1.0 (agregador de pesquisas eleitorais)"
          curl -fsS -A "$UA" -G https://pt.wikipedia.org/w/index.php --data-urlencode "title=Pesquisas eleitorais para a eleição estadual de 2026 em São Paulo" --data-urlencode action=raw -o sp.wiki
          echo "########## cabeçalhos"; grep -n -E "^==+" sp.wiki
          echo "########## linhas com chaves desbalanceadas"
          awk '{o=gsub(/\{\{/,"&"); c=gsub(/\}\}/,"&"); if (o!=c) print NR": "substr($0,1,160)}' sp.wiki | head -40
          echo "########## linhas com [[ sem ]]"
          awk '{o=gsub(/\[\[/,"&"); c=gsub(/\]\]/,"&"); if (o!=c) print NR": "substr($0,1,160)}' sp.wiki | head -40
          echo "########## Senador: as 40 primeiras linhas da seção"
          awk '/^== Senador/,0' sp.wiki | head -60 | cut -c1-170
          echo "########## parser: senador/SP e governador/SP (main vs branch)"
          python3 - <<'PY'
          import json
          pages=json.load(open('scripts/wiki-pages.json'))
          json.dump([p for p in pages if p.get('state')=='SP'], open('sub.json','w'))
          PY
          python3 scripts/wiki_parse.py sub.json > b.json 2>/dev/null; echo "branch exit $?"
          git fetch -q origin main && git show origin/main:scripts/wiki_parse.py > wp_main.py && python3 wp_main.py sub.json > m.json 2>/dev/null; echo "main exit $?"
          python3 - <<'PY'
          import json
          for tag,f in (("MAIN","m.json"),("BRANCH","b.json")):
              polls=json.load(open(f))['polls']
              print("==", tag, len(polls), "polls")
              for p in polls:
                  if p.get('race')=='senador' and (p.get('fieldwork_end') or '')>='2026-09-08' and p.get('pollster') in ('Paraná Pesquisas','Veritá','Real Time Big Data','Futura'):
                      print("  ", p.get('pollster'), p.get('fieldwork_end'), p.get('sample_size'), [(r.get('candidate'), r.get('pct')) for r in p.get('results',[])][:6])
              vaz=[p for p in polls if any(str(r.get('candidate','')).startswith('[[') for r in p.get('results',[]))]
              print("  com '[[':", len(vaz), sorted({p.get('race') for p in vaz}))
              if vaz: print("   ex.:", [(r.get('candidate')) for r in vaz[0]['results']][:6])
          PY
          true
